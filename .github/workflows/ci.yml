name: CI

on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm run db:generate
        env:
          # Prisma generate does not require a live DB, only a valid-looking URL
          DATABASE_URL: postgresql://user:password@localhost:5432/screenriot?schema=public

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

